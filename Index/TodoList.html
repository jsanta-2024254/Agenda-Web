<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>ToDo List</title>
	<link rel="stylesheet" href="../Styles/todoList.css">
</head>
<body>
	<main class="container">
		<h1>Lista de Pendientes</h1>

		<section class="new-task">
			<h2>Agregar pendiente</h2>
			<form id="taskForm">
				<label>
					Tarea
					<input type="text" id="taskTitle" required maxlength="100" placeholder="Descripción breve" />
				</label>
				<label>
					Detalles
					<textarea id="taskDetails" rows="2" placeholder="Detalles (opcional)"></textarea>
				</label>
				<label>
					Prioridad
					<select id="taskPriority">
						<option value="1">Alta</option>
						<option value="2" selected>Media</option>
						<option value="3">Baja</option>
					</select>
				</label>
				<div class="form-actions">
					<button type="submit" id="addBtn">Agregar</button>
					<button type="reset">Limpiar</button>
				</div>
			</form>
		</section>

		<section class="tasks">
			<h2>Tareas (ordenadas por prioridad)</h2>
			<div id="tasksList" class="tasks-list"></div>
			<p id="emptyMsg" class="empty">No hay tareas. Agrega tu primera tarea.</p>
		</section>
	</main>

	<script src="../scripts/todoList.js"></script>
</body>
</html>
